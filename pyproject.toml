[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amlguard-eu"
version = "0.1.0"
description = "Auditable research platform for a human-supervised AML investigation agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "authlib>=1.4,<2",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "faker>=33,<40",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
proofagent = ["proofagent-harness==0.11.0"]
research = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
amlguard = "amlguard.cli:app"
amlguard-worker = "amlguard.experiments.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amlguard"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "eden_live: requires EDEN_AI_API_KEY and makes paid EU endpoint calls",
  "proofagent_live: requires the optional ProofAgent dependency and evaluator credentials",
  "postgres: requires the local PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".pytest-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "pandas", "statsmodels.*"]
ignore_missing_imports = true
