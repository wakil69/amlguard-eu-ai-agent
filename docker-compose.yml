name: amlguard-eu

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: amlguard
      POSTGRES_USER: amlguard
      POSTGRES_PASSWORD: amlguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amlguard -d amlguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: amlguard
      KC_DB_PASSWORD: amlguard
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./config/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports: ["8081:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn amlguard.api.app:create_app --factory --host 0.0.0.0 --port 8000
    env_file: [.env.docker]
    environment:
      AMLGUARD_DATABASE_URL: postgresql+asyncpg://amlguard:amlguard@postgres:5432/amlguard
      AMLGUARD_DATABASE_DSN: postgresql://amlguard:amlguard@postgres:5432/amlguard?options=-csearch_path%3Dlanggraph
      AMLGUARD_REPOSITORY_BACKEND: postgres
      AMLGUARD_KEYCLOAK_ISSUER: http://localhost:8081/realms/amlguard
      AMLGUARD_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/amlguard
      AMLGUARD_OTEL_ENDPOINT: http://otel-collector:4318
      AMLGUARD_OTEL_HEALTH_ENDPOINT: http://otel-collector:13133
      AMLGUARD_ARTIFACT_KEY_FILE: /run/secrets/artifact_key
    secrets: [artifact_key]
    volumes:
      - restricted-artifacts:/app/.artifacts
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  seed:
    build: .
    command:
      - amlguard
      - seed
      - --seed
      - "20260810"
      - --inject-pack
      - development
      - --persist
    env_file: [.env.docker]
    environment:
      AMLGUARD_DATABASE_URL: postgresql+asyncpg://amlguard:amlguard@postgres:5432/amlguard
      AMLGUARD_REPOSITORY_BACKEND: postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["seed"]

  worker:
    build: .
    command: ["amlguard-worker"]
    env_file: [.env.docker]
    environment:
      AMLGUARD_DATABASE_URL: postgresql+asyncpg://amlguard:amlguard@postgres:5432/amlguard
      AMLGUARD_DATABASE_DSN: postgresql://amlguard:amlguard@postgres:5432/amlguard?options=-csearch_path%3Dlanggraph
      AMLGUARD_REPOSITORY_BACKEND: postgres
      AMLGUARD_ARTIFACT_KEY_FILE: /run/secrets/artifact_key
    secrets: [artifact_key]
    volumes:
      - restricted-artifacts:/app/.artifacts
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["experiments"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./config/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports: ["9090:9090"]
    profiles: ["observability"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml"]
    volumes:
      - ./config/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports: ["9093:9093"]
    profiles: ["observability"]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/observability/tempo.yaml:/etc/tempo.yaml:ro
    profiles: ["observability"]

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./config/observability/loki.yaml:/etc/loki/local-config.yaml:ro
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    profiles: ["observability"]

secrets:
  artifact_key:
    file: ./secrets/artifact_key.dev

volumes:
  postgres-data:
  restricted-artifacts:
