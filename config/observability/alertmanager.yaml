route:
  receiver: local-observability
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-observability
# Replace the local receiver with an approved webhook, email, PagerDuty, or
# equivalent receiver in a deployed environment. No external destination is
# enabled by default because it requires operator-owned credentials.
